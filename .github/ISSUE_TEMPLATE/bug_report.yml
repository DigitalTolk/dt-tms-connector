name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: TYPO3, PHP, l10nmgr and this extension.
      placeholder: TYPO3 13.4.39, PHP 8.3, l10nmgr 13.0.0, dt_tms_connector 0.1.0
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Output of the sync command or the error in the module
      description: Remove tokens, connection keys, URLs with signatures and customer content before you paste.
      render: text
