name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}, TYPO3 ${{ matrix.typo3 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        typo3: ['^12.4', '^13.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, ftp, intl, json, zip
          tools: composer:v2
          coverage: none
      - name: Allow TYPO3 12.4, which only gets fixes through paid extended support
        if: matrix.typo3 == '^12.4'
        run: composer config audit.block-insecure false
      - name: Install
        run: |
          composer require --no-update --no-interaction "typo3/cms-core:${{ matrix.typo3 }}" "typo3/cms-backend:${{ matrix.typo3 }}" "typo3/cms-fluid:${{ matrix.typo3 }}" "typo3/cms-scheduler:${{ matrix.typo3 }}"
          composer update --no-interaction --no-progress --with-all-dependencies
      - run: composer validate --no-check-publish
      - run: find Classes Configuration Tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: PHP_CS_FIXER_IGNORE_ENV=1 vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: vendor/bin/phpunit

  audit:
    name: composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          extensions: dom, ftp, intl, json, zip
          tools: composer:v2
          coverage: none
      - name: Resolve the dependencies for TYPO3 13.4
        run: composer update --no-dev --no-interaction --no-progress --no-install
      - name: Check them for known security advisories
        run: composer audit --no-dev --locked --abandoned=report
